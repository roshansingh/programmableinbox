title = "Programmable Inbox — secret scanning"

# Start from gitleaks' full upstream ruleset, then layer this repo's specifics on
# top. Never set `useDefault = false`: that would silently drop ~170 upstream
# detectors and leave only what is written below.
[extend]
useDefault = true

# `sk_live_` is BOTH this application's API key prefix (lib/api-key-scopes.ts)
# and Stripe's live secret key prefix. Stripe is now a dependency (issue #120),
# so the tripwire the previous version of this comment described has been
# reached — but the upstream rule still cannot be re-enabled as-is, because it
# matches every one of this repo's ~41 `sk_live_` test fixtures.
#
# The two formats are distinguishable by shape rather than prefix:
#
#   ours    `sk_live_` + exactly 48 LOWERCASE HEX  (crypto.randomBytes(24).toString('hex'))
#   Stripe  `sk_live_` + 24-107 BASE62             (mixed case in practice)
#
# So `stripe-secret-key` below requires an uppercase letter, which our format
# can never contain, and `programmable-inbox-api-key` requires 48 lowercase hex,
# which a Stripe key effectively never is. Neither rule can fire on the other's
# keys, and both fire on their own.
disabledRules = ["stripe-access-token"]

# ---------------------------------------------------------------------------
# Repo-specific rules
#
# These are high-precision: they match the exact shape of a credential this
# system issues, so they carry NO path exclusions and fire everywhere —
# including inside __tests__/, where a real key pasted in while debugging is a
# realistic way to leak one.
# ---------------------------------------------------------------------------

# Minted as `sk_live_${crypto.randomBytes(24).toString('hex')}`
# (app/api/app/apiKeys/route.ts) => exactly 48 lowercase hex characters.
# Every placeholder in the suite is either shorter or contains letters outside
# [a-f] (`sk_live_newkeygenerated123456`, `sk_live_abcd1234efgh5678ijkl9012…`),
# so none of them can match this.
[[rules]]
id = "programmable-inbox-api-key"
description = "Programmable Inbox live API key (sk_live_ + 48 hex)"
regex = '''sk_live_[0-9a-f]{48}'''
keywords = ["sk_live_"]
tags = ["api-key", "programmable-inbox"]

# Stripe secret and restricted keys (issue #120), replacing the upstream
# `stripe-access-token` rule disabled above.
#
# The uppercase letter is the whole discriminator, and it is why this cannot be
# a simple length or charset rule: this repo's own `sk_live_` keys are 48
# characters of lowercase hex, so any rule that matches "sk_live_ + N
# alphanumerics" fires on every fixture in the suite. Requiring `[A-Z]`
# somewhere makes the two formats mutually exclusive.
#
# RE2 has no lookahead, so "contains an uppercase" is expressed positionally:
# some base62, an uppercase, more base62. A real Stripe key is 24-107 base62
# characters, so the chance it contains no uppercase at all is (36/62)^24 —
# about three in a million. Every placeholder in this repo (`sk_test_abcdef…`,
# `sk_live_abcd1234efgh…`) is entirely lowercase and cannot match.
[[rules]]
id = "stripe-secret-key"
description = "Stripe secret or restricted API key"
regex = '''(?:sk|rk)_(?:live|test)_[0-9a-zA-Z]{6,}[A-Z][0-9a-zA-Z]{6,}'''
keywords = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]
tags = ["api-key", "stripe"]

# Stripe webhook signing secret (STRIPE_WEBHOOK_SECRET). Same discriminator: the
# real thing is base64-ish with mixed case, and the placeholders here
# (`whsec_xxxx…`, `whsec_abcdef…`) are lowercase only.
[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''whsec_[0-9a-zA-Z]{6,}[A-Z][0-9a-zA-Z]{6,}'''
keywords = ["whsec_"]
tags = ["secret", "stripe"]

# Resend keys as actually issued: `re_<id>_<secret>`. Gitleaks runs on Go's RE2,
# which has no lookahead, so the exclusion is expressed through shape instead —
# and none is needed: the suite's `re_test_key_123456` has only 4 characters
# before its underscore, and `.env.example`'s `re_xxxxxxxx` has no second
# segment, so neither reaches the {8,} + `_` + {16,} form below.
[[rules]]
id = "resend-api-key"
description = "Resend API key (AUTH_RESEND_API_KEY)"
regex = '''re_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,}'''
keywords = ["re_"]
tags = ["api-key", "resend"]

# ---------------------------------------------------------------------------
# Allowlists
#
# Deliberately keyed on the SECRET VALUE, not on the file path. A path allowlist
# for `__tests__/` would suppress every rule inside it, including the two above,
# so a genuinely leaked key dropped into a test file would pass CI silently.
# Matching known placeholder literals instead keeps every file fully scanned.
#
# Consequence, by design: adding a new fake credential to the suite requires
# adding it here. That is the intended friction — each entry is a human deciding
# a specific string is not a secret.
#
# EVERY entry below is anchored with ^...$ and must match the whole extracted
# secret. Gitleaks allowlist regexes match as substrings, so an unanchored
# placeholder would also suppress any longer real secret that merely contains it.
# Anchor anything added here.
# ---------------------------------------------------------------------------

[[allowlists]]
description = "Known placeholder credentials used by the test suite and docs"
targets = ["secret"]
regexes = [
  # Fake `sk_live_`/`sk_test_` keys, matched by SHAPE rather than enumerated.
  # Anchored at both ends and capped at 44 characters after the prefix, while a
  # real key is always exactly 48 hex characters — so no real key can satisfy
  # this, however many new fixtures get added. Anchoring is load-bearing:
  # gitleaks allowlist regexes match as substrings, so an unanchored
  # `sk_live_[0-9a-f]{1,44}` would match the first 44 characters OF a real key
  # and silently suppress it.
  '''^sk_(live|test)_[0-9a-zA-Z]{1,44}$''',
  # lib/auth, lib/config, and email-verification suites
  '''^verification-secret-at-least-16(-chars)?$''',
  '''^integration-verification-secret-16$''',
  # test/integration/setup/setup.ts assigns the integration harness its own
  # signing key so the suite cannot be broken by an operator's .env.test. It is
  # a literal in tracked source and never signs anything outside the test DB.
  # Listed alone rather than as an `^integration-test-.*$` shape: the sibling
  # fixtures beside it trip no rule, and a family-wide pattern would pre-approve
  # strings nobody has looked at, which is the friction this section wants.
  '''^integration-test-jwt-secret-at-least-16-chars$''',
  '''^rotated-secret-12345$''',
  '''^re_test_key_[0-9]+$''',
  '''^sk-ant-test$''',
  # Fake PostHog project key used across the product-analytics test suite
  # (app/api/app/webhooks/__tests__/product-analytics.test.ts,
  # lib/config/__tests__/schema-product-analytics.test.ts,
  # ee/product-analytics/__tests__/*.test.ts, etc.).
  '''^phc_test1234567890$''',
  # v0.app scaffold demo data, removed from app/api-keys/page.tsx but still
  # reachable by a full-history scan.
  #
  # Note this one stays deliberately broad: `[A-Za-z0-9]+` is unbounded, so the
  # anchors do not stop it matching a real key of this shape. That is acceptable
  # only because `pk_` is Stripe's *publishable* prefix — those keys are designed
  # to ship in client-side bundles and are not credentials. The secret-key
  # equivalent (`sk_`) is handled by the bounded pattern above, and narrowing
  # this to the three scaffold literals would add precision without reducing any
  # real risk.
  '''^pk_(live|test)_51[A-Za-z0-9]+$''',
]

# Paths excluded here are non-source only: build output, dependencies, and
# generated code. No application or test source is path-excluded.
[[allowlists]]
description = "Lockfiles, generated code, dependencies, and build output"
targets = ["match"]
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)node_modules/''',
  '''^lib/generated/''',
  '''^\.next/''',
  '''(^|/)\.claude/worktrees/''',
]
