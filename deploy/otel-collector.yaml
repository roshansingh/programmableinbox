# OpenTelemetry Collector config for the `otel-collector` service in
# docker-compose.yml. See docs/architecture/observability.md for the design
# and docs/observability-operator-guide.md for setup.
#
# Two independent ingestion paths feed one export pipeline per signal:
#
#   traces: app (@vercel/otel, OTLP push)  -> otlp receiver -> otlphttp exporter
#   logs:   this host's Docker stdout files -> filelog receiver -> otlphttp exporter
#
# Logs are NOT pushed over OTLP by the app. `pino-opentelemetry-transport`
# was removed for that reason (ee/observability/init.ts only registers
# traces now) — instead this collector tails every container's Docker
# json-file log output, which requires the app to write plain JSON to
# stdout (already true in production: lib/logger.config.ts only uses
# pino-pretty when NODE_ENV != production, and Dockerfile always sets
# NODE_ENV=production).
#
# ${env:OTEL_EXPORTER_ENDPOINT} / ${env:OTEL_EXPORTER_AUTH} are THIS
# collector's own credentials for the real backend (e.g. Grafana Cloud's
# OTLP gateway URL and a `Authorization=Basic <base64>` header) — distinct
# from the app's OTEL_EXPORTER_OTLP_* vars, which now just point at this
# collector over the private docker network and carry no real secret.

extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    timeout: 10s

receivers:
  # Traces pushed directly by the app (@vercel/otel -> OTEL_EXPORTER_OTLP_ENDPOINT).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Every container's stdout, via Docker's json-file log driver. Not every
  # non-app container's output is JSON — Postgres and Redis write plain
  # text — but some are: Caddy defaults to JSON logging on stderr whenever
  # it isn't attached to a TTY, which is always true here. The json_parser
  # operator below is best-effort (on_error: send_quiet) either way, so plain-text
  # lines pass through with their raw text as the log body instead of being
  # dropped or crashing the pipeline, and Caddy's JSON lines parse
  # successfully but are kept out of the app-only processing below (see the
  # `transform/logs` processor's guard). There is no per-container filter:
  # doing that correctly needs the container name, which isn't recoverable
  # from the log file path alone (Docker names the file by container ID)
  # without also talking to the Docker API.
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    # Tailing from "end" costs nothing for ongoing logs — a container
    # restart is a brand-new log file, so "end" and "beginning" are the
    # same zero bytes for it. It matters only for files that already
    # existed when the collector first sees them: "beginning" would burst
    # every container's entire log history at the backend the first time
    # the `observability` profile is ever activated on an already-running
    # host, which is both slow and (against a metered endpoint like
    # Grafana Cloud's free tier) potentially costly.
    start_at: end
    storage: file_storage
    include_file_path: false
    include_file_name: false
    operators:
      # Un-wraps Docker's json-file envelope: {"log": "...", "stream":
      # "stdout", "time": "..."} -> body becomes the raw line, and a
      # `time` attribute carries Docker's own receive timestamp (used as a
      # fallback below if the line isn't Pino JSON with its own `time`).
      #
      # add_metadata_from_filepath is explicitly off: it defaults to true
      # and extracts Kubernetes pod/namespace/container metadata from the
      # file path, which is meaningless here (plain Docker Compose, no
      # k8s) — and it requires `include_file_path: true` on the receiver
      # to have the attribute it reads from, which this config deliberately
      # doesn't set. Left at its default, every single entry failed this
      # operator with "log record attribute 'log.file.path' is missing",
      # and per pkg/stanza/fileconsumer's reader loop, an operator error on
      # a batch does not just log and retry — the read offset advances past
      # it regardless, so the batch is dropped for good. Confirmed live:
      # this caused actual log loss, not just log noise, until fixed here.
      - type: container
        format: docker
        add_metadata_from_filepath: false

      # Pino writes one JSON object per line in production (see header
      # comment). on_error: send_quiet means a non-JSON line (Postgres,
      # Redis, and anything else that isn't JSON at all) just keeps its raw
      # text as the body instead of failing the pipeline — `send_quiet`
      # rather than `send` because this is the EXPECTED, common case
      # (most containers here aren't Pino), and `send` logs at Error level
      # on every single failure: with Postgres/Redis writing plain text
      # continuously, that would flood the collector's own logs with a
      # false-alarm error per line. `send_quiet` does the identical
      # pass-through, just logged at Debug instead.
      - type: json_parser
        parse_from: body
        parse_to: attributes
        on_error: send_quiet

      # Pino's numeric level (10/20/30/40/50/60) mapped to OTel's
      # SeverityNumber scale. Consumes attributes.level on success; a
      # non-Pino line has no `level` attribute, so this is a no-op there —
      # see the json_parser comment above for why on_error is send_quiet.
      - type: severity_parser
        parse_from: attributes.level
        on_error: send_quiet
        mapping:
          trace: 10
          debug: 20
          info: 30
          warn: 40
          error: 50
          fatal: 60

      # Pino's message key is `msg` (lib/logger.config.ts uses the
      # default) — but Caddy's default JSON logging also has a `msg` key
      # (always "handled request"), so `attributes.msg != nil` alone isn't
      # Pino-specific. Also require `attributes.pid`, which Pino's base
      # object always adds (lib/logger.config.ts does not override `base`)
      # and Caddy's zap-based encoder does not use — same discriminator the
      # `transform/logs` processor uses below. Without it, this would
      # overwrite Caddy's structured request-log body with the literal
      # string "handled request", discarding the rest of that line.
      - type: move
        from: attributes.msg
        to: body
        if: 'attributes.msg != nil && attributes.pid != nil'

      # Pino's timestamp key is `time` (pino.stdTimeFunctions.isoTime),
      # formatted like 2024-01-01T00:00:00.000Z. Falls back to Docker's own
      # receive time (set by the `container` operator above) for non-Pino
      # lines — see the json_parser comment above for why on_error is
      # send_quiet rather than send.
      - type: time_parser
        parse_from: attributes.time
        layout_type: gotime
        layout: '2006-01-02T15:04:05.000Z'
        on_error: send_quiet

processors:
  batch: {}

  # Everything here is guarded on `attributes["level"] != nil and
  # attributes["pid"] != nil` — present only for lines actually written by
  # this app's Pino logger. `level` alone is NOT enough: Caddy's own
  # default JSON logging (zap, active for any container without a TTY —
  # true for every container here) also includes a `level` key, so a
  # level-only guard would still mislabel Caddy's logs as the app's. Pino's
  # default base object (lib/logger.config.ts does not override `base`)
  # always adds `pid`/`hostname`, and zap's default encoder does not use
  # either of those key names, so the combination is what actually scopes
  # this to app log lines — without it, every other container's logs
  # (postgres, caddy, redis, ...) would also get stamped
  # `service.name=programmableinbox`, making e.g. a Caddy TLS error indistinguishable
  # from an app error in the backend.
  #
  # trace_id/span_id: promotes the JSON fields injected by
  # lib/logger.config.ts's Pino mixin into the log record's actual OTel
  # trace context, so Grafana's Loki<->Tempo "jump from span to logs"
  # correlation keeps working even though logs no longer travel through the
  # same in-process OTel SDK as traces. `TraceID`/`SpanID` (not
  # `ParseTraceID`/`ParseSpanID`, which don't exist as OTTL functions) parse
  # the hex string into the record's trace context. These two are only
  # guarded on trace_id/span_id presence, not the Pino-line guard above —
  # they're already no-ops for any line lacking those specific attributes.
  #
  # The trailing delete_keys drop attributes.level/time/trace_id/span_id
  # once consumed — severity_parser and time_parser don't remove their
  # source field on their own, so without this every app log record would
  # carry redundant copies of data already promoted onto Severity/Timestamp/
  # trace context. attributes.level/time are guarded on the same Pino-line
  # check as the service.name stamp above: Caddy's JSON logs also carry a
  # `level` key (though its timestamp key is `ts`, not `time` — see
  # https://caddyserver.com — so `time` specifically wouldn't collide
  # today, but the guard is here on principle rather than relying on that).
  # trace_id/span_id need no such guard — only lines the promotion above
  # actually matched ever have those keys at all, Pino or not.
  transform/logs:
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["service.name"], "${env:OTEL_SERVICE_NAME}") where attributes["level"] != nil and attributes["pid"] != nil
          - set(trace_id, TraceID(attributes["trace_id"])) where attributes["trace_id"] != nil
          - set(span_id, SpanID(attributes["span_id"])) where attributes["span_id"] != nil
          - delete_key(attributes, "trace_id")
          - delete_key(attributes, "span_id")
          - delete_key(attributes, "level") where attributes["pid"] != nil
          - delete_key(attributes, "time") where attributes["pid"] != nil

exporters:
  # A single OTLP/HTTP exporter, shared by both pipelines: the collector
  # appends /v1/traces or /v1/logs to the same base endpoint per pipeline,
  # same convention the app's own OTEL_EXPORTER_OTLP_ENDPOINT already
  # follows. Vendor-neutral — any OTLP-compatible backend works, Grafana
  # Cloud is just the documented reference (docs/observability-operator-guide.md).
  otlphttp:
    endpoint: ${env:OTEL_EXPORTER_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_EXPORTER_AUTH}

service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    logs:
      receivers: [filelog/docker]
      processors: [transform/logs, batch]
      exporters: [otlphttp]
