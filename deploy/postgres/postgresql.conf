listen_addresses = '*'

# Memory — sized for an AX42 (64 GB RAM). Adjust if you change the box class.
shared_buffers = 16GB
effective_cache_size = 48GB
work_mem = 32MB
maintenance_work_mem = 2GB

# WAL archiving for WAL-G
wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/walg-archive-wrapper %p'
archive_timeout = 60
max_wal_senders = 3
restore_command = 'wal-g wal-fetch %f %p'

# Logging
log_min_duration_statement = 1000
log_destination = 'stderr'
log_line_prefix = '%t [%p] %q%u@%d '
