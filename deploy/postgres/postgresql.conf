listen_addresses = '*'

# Memory — sized for this OVH box (`pibx`): 32 GB RAM, 12 vCPU, shared with the
# app / redis / caddy / backup-cron containers. shared_buffers ~25% RAM;
# effective_cache_size kept to ~60% RAM (conservative — RAM is shared, not PG-only).
shared_buffers = 8GB
effective_cache_size = 20GB
work_mem = 32MB
maintenance_work_mem = 1GB

# Parallelism — 12 vCPU available (server defaults cap at 8)
max_worker_processes = 12
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# WAL archiving for WAL-G
wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/walg-archive-wrapper %p'
archive_timeout = 60
max_wal_senders = 3
restore_command = 'wal-g wal-fetch %f %p'

# Timezone — pinned, not left to the host.
#
# Prisma's query engine sends timestamps as naive strings (the UTC wall clock,
# with no offset). Postgres casts that text into a timestamptz column using the
# *session* timezone, so a non-UTC session silently stores an instant shifted by
# that offset. Prisma applies the inverse shift on read, which makes the skew
# invisible through the ORM — but every raw-SQL reader sees the shifted value.
#
# This bit a real query: the grouped-threads cursor in
# app/api/v1/emailInbox/[id]/messages/grouped-query.ts compares a DB-side
# extract(epoch from "createdAt") against a cursor built from a Prisma-read
# Date. Under a UTC-4 session those disagree by 4h and pagination returns
# nothing. Measured on Postgres 17: session America/New_York -> 4h skew,
# session UTC -> 0h.
#
# The postgres:*-bookworm image already runs UTC, so this is belt-and-braces for
# the container — it exists so a host or image change cannot silently
# reintroduce the skew. Application connections set it too, via `options=-c
# timezone=UTC` on DATABASE_URL (see .env.example), which is what protects
# non-container environments such as local dev.
timezone = 'UTC'

# Logging
log_min_duration_statement = 1000
log_destination = 'stderr'
log_line_prefix = '%t [%p] %q%u@%d '
