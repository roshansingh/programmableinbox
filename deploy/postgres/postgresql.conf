listen_addresses = '*'

# Memory — sized for this OVH box (`pibx`): 32 GB RAM, 12 vCPU, shared with the
# app / redis / caddy / backup-cron containers. shared_buffers ~25% RAM;
# effective_cache_size kept to ~60% RAM (conservative — RAM is shared, not PG-only).
shared_buffers = 8GB
effective_cache_size = 20GB
work_mem = 32MB
maintenance_work_mem = 1GB

# Parallelism — 12 vCPU available (server defaults cap at 8)
max_worker_processes = 12
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# WAL archiving for WAL-G
wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/walg-archive-wrapper %p'
archive_timeout = 60
max_wal_senders = 3
restore_command = 'wal-g wal-fetch %f %p'

# Logging
log_min_duration_statement = 1000
log_destination = 'stderr'
log_line_prefix = '%t [%p] %q%u@%d '
