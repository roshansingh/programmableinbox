name: programmableinbox

networks:
  programmableinbox-internal:
    driver: bridge

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
  otel-collector-storage:
    name: otel-collector-storage

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - programmableinbox-internal
    depends_on:
      - app

  app:
    image: ${APP_IMAGE:-ghcr.io/programmableinbox/programmableinbox}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # DATABASE_URL in app.env MUST point at the least-privileged runtime role
    # (programmableinbox_app): DML only, no DDL, not a superuser. See deploy/README.md
    # §"Database roles" and deploy/runbooks/04-postgres-role-rotation.md.
    env_file: /srv/programmableinbox/secrets/app.env
    expose:
      - "4000"
    networks:
      - programmableinbox-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Ships traces (pushed by app over OTLP) and logs (tailed from this host's
  # Docker stdout files) to the OTLP backend an operator configures via
  # OTEL_EXPORTER_ENDPOINT/OTEL_EXPORTER_AUTH in otel-collector.env. Opt-in
  # via the `observability` profile — the app already no-ops all telemetry
  # when ENABLE_OBSERVABILITY=false, but a container tailing every other
  # service's log files is its own thing to run only when wanted. Start it
  # alongside `docker compose up -d` with
  # `docker compose --profile observability up -d` whenever
  # ENABLE_OBSERVABILITY=true is set. See docs/observability-operator-guide.md.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: ["observability"]
    restart: unless-stopped
    # The upstream image runs as a non-root user by default, which cannot
    # read /var/lib/docker/containers (root-owned on essentially every
    # Linux host). Root here is a read-only-mount + own-storage-volume
    # container, not a privilege boundary around app secrets — see the
    # env_file note below for why it doesn't have any app secrets to lose.
    user: "0:0"
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    # Deliberately its OWN file, not app.env: this image is a third-party
    # contrib build with a read-only mount over every container's log
    # history, so it gets only what it needs (the real OTLP backend
    # credentials) rather than app.env's full JWT_SECRET/WEBHOOK_SECRET/
    # DATABASE_URL/AUTH_* set. See deploy/README.md Part 9.
    env_file: /srv/programmableinbox/secrets/otel-collector.env
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-collector-storage:/var/lib/otelcol/file_storage
      # Read-only tail of every container's stdout (Docker's json-file log
      # driver) — see deploy/otel-collector.yaml for why this is the log
      # ingestion path instead of an in-process OTLP push from the app.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - programmableinbox-internal
    # Not published to the host and not exposed to any other network — only
    # reachable from `app`, over the internal bridge, by service name.
    expose:
      - "4317"
      - "4318"

  migrate:
    image: ${APP_IMAGE:-ghcr.io/programmableinbox/programmableinbox}:${IMAGE_TAG:-latest}
    profiles: ["migrate"]
    env_file: /srv/programmableinbox/secrets/app.env
    networks:
      - programmableinbox-internal
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations are the ONLY thing that runs DDL, and they run as the schema
    # owner (programmableinbox_migrator) — never as the app's runtime role and never as a
    # superuser. app.env carries both URLs; DATABASE_URL is the runtime one, so
    # it is swapped for MIGRATE_DATABASE_URL here (Prisma only reads
    # DATABASE_URL, via prisma.config.ts). `$$` is escaped so compose passes the
    # expansion through to the shell instead of interpolating it itself.
    #
    # Invoke the CLI directly — the standalone runtime image has node_modules/prisma
    # but not node_modules/.bin, so `npx prisma` can't resolve the executable.
    command:
      - sh
      - -c
      - |
        set -e
        : "$${MIGRATE_DATABASE_URL:?MIGRATE_DATABASE_URL is not set in app.env — migrations must not run as the app or superuser role. See deploy/runbooks/04-postgres-role-rotation.md}"
        export DATABASE_URL="$$MIGRATE_DATABASE_URL"
        exec node node_modules/prisma/build/index.js migrate deploy

  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/programmableinbox/programmableinbox-postgres}:${POSTGRES_TAG:-17}
    restart: unless-stopped
    # POSTGRES_USER/PASSWORD are the *bootstrap superuser* the image entrypoint
    # creates — break-glass only, nothing connects as it. The image's initdb
    # hook reads POSTGRES_{APP,MIGRATOR,BACKUP}_PASSWORD from this same file to
    # create the least-privileged roles, but ONLY on a first-time init with an
    # empty pgdata. Existing volumes: deploy/scripts/pg-apply-least-privilege.sh.
    env_file: /srv/programmableinbox/secrets/app.env
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - /srv/programmableinbox/pgdata:/var/lib/postgresql/data
    networks:
      - programmableinbox-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backup-cron:
    image: ${BACKUP_IMAGE:-ghcr.io/programmableinbox/programmableinbox-backup}:${BACKUP_TAG:-latest}
    restart: unless-stopped
    # Connects as POSTGRES_BACKUP_USER (read-only via pg_read_all_data, plus
    # write on `backup_status` only). Falls back to the bootstrap superuser with
    # a loud warning in /var/log/backup/cron.log if that is unset.
    env_file: /srv/programmableinbox/secrets/app.env
    volumes:
      - /srv/programmableinbox/backup-logs:/var/log/backup
      - /srv/programmableinbox/secrets:/secrets:ro
    networks:
      - programmableinbox-internal
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - /srv/programmableinbox/redis:/data
    networks:
      - programmableinbox-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
