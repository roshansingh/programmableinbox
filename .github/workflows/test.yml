name: Tests

on:
  pull_request:
    branches: [main]
  # push:
  #   branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: test
          POSTGRES_DB: inbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://inbox:test@localhost:5432/inbox?options=-c%20timezone%3DUTC
      # Dedicated DB for the integration suite. The harness creates/migrates/drops
      # it per run; the name must contain "test" (safety guard refuses otherwise).
      TEST_DATABASE_URL: postgresql://inbox:test@localhost:5432/inbox_test?schema=public
      # At least 16 chars — lib/config rejects a shorter signing secret.
      JWT_SECRET: test-jwt-secret-at-least-16-chars
      WEBHOOK_SECRET: test-webhook-secret
      # Read by the system-endpoint integration tests (cron sweeper, healthz).
      AUTOMATION_SWEEPER_SECRET: test-sweeper-secret
      HEALTHZ_SECRET: test-healthz-secret
      AUTH_RESEND_API_KEY: re_test_key
      AUTH_EMAIL_FROM: test@example.com
      AUTH_EMAIL_FROM_NAME: Test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run integration tests (real Postgres)
        run: npm run test:integration

      - name: Test results
        if: always()
        run: echo "✅ All tests passed"
