name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
      # NOTE: `npm run lint` is intentionally omitted — the repo's eslint
      # config is currently missing (pre-existing). Re-add this step once
      # eslint.config.js is added.
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: |
          echo "app_image=ghcr.io/${{ github.repository }}" >>"$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:latest
            ${{ steps.meta.outputs.app_image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push postgres image
        uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}-postgres:17
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

      - name: Build & push backup image
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}-backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/inboxui
            /srv/inboxui/deploy.sh ${{ needs.build.outputs.sha }}
