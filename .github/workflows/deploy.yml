name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@127.0.0.1:5432/dummy
      - run: npm run lint
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      app_image: ${{ steps.meta.outputs.app_image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: |
          echo "app_image=ghcr.io/${{ github.repository }}" >>"$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}:latest
            ${{ steps.meta.outputs.app_image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push postgres image
        uses: docker/build-push-action@v6
        with:
          context: deploy/postgres
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}-postgres:17
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

      - name: Build & push backup image
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}-backup:latest
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      # Keep the base compose file on the box authoritative on every deploy so
      # the routine deploy below can never run against a drifted definition.
      # Server-specific tuning lives in docker-compose.override.yml, which this
      # never touches.
      - name: Sync compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: deploy/docker-compose.yml
          target: /srv/inboxui/
          strip_components: 1

      # otel-collector.yaml is bind-mounted by the (opt-in, profile-gated)
      # otel-collector service — see docker-compose.yml. It must land next
      # to docker-compose.yml on the server for that mount to resolve.
      # Routine deploys never recreate otel-collector itself (same as
      # postgres/redis, it's outside the --no-deps app+caddy roll below) —
      # an operator who has already turned observability on picks up a
      # changed config with `docker compose --profile observability up -d
      # --no-deps otel-collector` (deploy/README.md Part 9), same as any
      # other config-only change to a running service. This step only
      # keeps the file on disk from silently drifting from what's in git.
      - name: Sync otel-collector config to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: deploy/otel-collector.yaml
          target: /srv/inboxui/
          strip_components: 1

      # Keep the manual initial-deploy / rollback script fresh for the runbooks.
      # It is NOT used by this workflow — routine deploys are inlined below.
      - name: Sync initial-deploy script to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: deploy/scripts/initial_deploy.sh
          target: /srv/inboxui/
          strip_components: 2

      # Routine deploy, inlined so there is no server-side script to drift:
      # pull app+migrate only, run migrations to completion, then recreate ONLY
      # app+caddy behind a health gate. postgres and redis are never pulled,
      # restarted, or recreated (--no-deps).
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /srv/inboxui
            export IMAGE_TAG="${{ needs.build.outputs.sha }}"

            PREVIOUS_TAG=$(docker inspect --format '{{ index .Config.Labels "image.tag" }}' inboxui-app-1 2>/dev/null || true)
            echo "Previous tag: ${PREVIOUS_TAG:-unknown}"
            echo "Rolling to:   ${IMAGE_TAG}"

            # Pull only app + migrate images; postgres/redis images untouched.
            docker compose pull app migrate

            # Apply migrations to completion before the new app starts.
            docker compose run --rm migrate

            # Recreate ONLY app + caddy; --no-deps leaves postgres/redis as-is.
            docker compose up -d --no-deps app caddy

            echo "Waiting for app to become healthy..."
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{ .State.Health.Status }}' inboxui-app-1 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "App healthy after ${i}0s"
                break
              fi
              sleep 10
            done

            if [ "$(docker inspect --format '{{ .State.Health.Status }}' inboxui-app-1)" != "healthy" ]; then
              echo "App did not become healthy. Inspect: docker compose logs --tail=100 app"
              exit 1
            fi

            docker image prune -f >/dev/null
            echo "Deploy complete: ${IMAGE_TAG}"
