name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # A dependency-free weekly sweep. Detection rules improve over time, so a
  # commit that scanned clean last month may not today — and for a public repo
  # the cost of noticing late is unbounded.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The scan reads code and reports; it needs nothing else.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    env:
      # Pinned rather than floating on "latest": a scanner that silently changes
      # ruleset between runs makes a green build unreproducible, and an upstream
      # regression would land straight in the merge gate.
      GITLEAKS_VERSION: '8.30.1'

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. The default shallow clone would scan only the tip
          # commit, so a secret added and then removed in an earlier commit —
          # the case that actually matters, because it survives in the object
          # database — would go unreported.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSfL "${base}/${archive}" -o "/tmp/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/checksums.txt

          # Verify before the binary is ever executed or installed. Pinning the
          # version alone does not help if the release asset is replaced or the
          # download is tampered with in transit — and this binary runs as the
          # gate that decides whether secrets reach a public repo, so a silently
          # swapped one could simply report success on everything.
          #
          # `sha256sum -c` fails if the named file is absent from the checksum
          # list, so a renamed or missing asset is an error rather than a skip.
          ( cd /tmp && grep " ${archive}\$" checksums.txt | sha256sum -c - )

          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            .

      # Findings are redacted above, so the artifact carries rule IDs and
      # locations but never the matched value — a scan report should not become
      # a second copy of the secret.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Result
        if: success()
        run: echo "✅ No secrets detected"
